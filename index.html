<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mırtı TV v101 JSON->M3U</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>body{background:#070b14;color:#fff;font-family:Arial;padding:10px}input,textarea,button{width:100%;margin:6px 0;padding:10px;border-radius:8px;border:1px solid #33486f;background:#0a1222;color:#fff}button{background:#d4b78f;color:#111;font-weight:800}pre{white-space:pre-wrap;background:#0a1222;padding:10px;border-radius:8px;max-height:60vh;overflow:auto;font-size:10px}</style>
</head><body>
<h3>JSON -> M3U Çevirici - patron_data.json için</h3>
<input id="jsonUrl" value="https://raw.githubusercontent.com/sevdimcim/vod-max/refs/heads/main/patron_data.json">
<button id="fetchBtn">JSON'u Çek ve M3U Yap</button>
<textarea id="jsonIn" placeholder="JSON içeriğini buraya yapıştır - çekemezse"></textarea>
<button id="convertBtn">Yapıştırdığını M3U Yap</button>
<pre id="out">#EXTM3U
# Hazır - v101
</pre>
<button id="copyBtn">M3U'yu Kopyala</button>
<button id="playBtn">Mırtı TV v100'de Oynat (AYAR'a atar)</button>
<script>
function toM3U(json){
  let arr=[];
  if(Array.isArray(json)) arr=json;
  else if(json.data && Array.isArray(json.data)) arr=json.data;
  else if(json.channels) arr=json.channels;
  else if(json.items) arr=json.items;
  else arr=Object.values(json).filter(v=>v && typeof v==='object');

  let m3u="#EXTM3U\n";
  arr.forEach(it=>{
    let title=it.title||it.name||it.ad||it.baslik||it.file_name||"Film";
    let logo=it.logo||it.poster||it.image||it.tvg_logo||it.thumb||"";
    let url=it.url||it.link||it.source||it.stream||it.file||it.video||it.playUrl||"";
    let group=it.group||it.category||it.genre||it.group_title||it.grup||"Film";
    let id=it.id||"";
    // url boşsa nested source içinde ara
    if(!url && it.sources && it.sources[0]) url=it.sources[0].file||it.sources[0].url||"";
    if(!url) return;
    m3u+=`#EXTINF:-1 tvg-id="${id}" tvg-name="${title}" tvg-logo="${logo}" group-title="${group}",${title}\n${url}\n`;
  });
  return m3u;
}
async function fetchJson(url){
  let urls=[
    "https://api.allorigins.win/raw?url="+encodeURIComponent(url),
    "https://corsproxy.io/?"+encodeURIComponent(url),
    url
  ];
  for(let u of urls){
    try{
      let r=await fetch(u,{cache:"no-store"});
      if(!r.ok) continue;
      let t=await r.text();
      if(t.trim().startsWith("<!DOCTYPE")||t.trim().startsWith("<html")) continue;
      let j=JSON.parse(t);
      return j;
    }catch(e){}
  }
  throw new Error("Çekilemedi");
}
document.getElementById("fetchBtn").onclick=async()=>{
  let url=document.getElementById("jsonUrl").value.trim();
  document.getElementById("out").textContent="Çekiliyor... "+url;
  try{
    let j=await fetchJson(url);
    let m3u=toM3U(j);
    document.getElementById("out").textContent=m3u.slice(0,20000)+(m3u.length>20000?"\n... "+m3u.length+" karakter":"");
    localStorage.setItem("mirti_json_m3u",m3u);
  }catch(e){
    document.getElementById("out").textContent="Hata: "+e.message+"\n\nJSON'u kopyalayıp alttaki alana yapıştır.";
  }
};
document.getElementById("convertBtn").onclick=()=>{
  try{
    let j=JSON.parse(document.getElementById("jsonIn").value);
    let m3u=toM3U(j);
    document.getElementById("out").textContent=m3u.slice(0,20000);
    localStorage.setItem("mirti_json_m3u",m3u);
  }catch(e){ document.getElementById("out").textContent="JSON parse hata: "+e.message; }
};
document.getElementById("copyBtn").onclick=()=>{ navigator.clipboard.writeText(document.getElementById("out").textContent); alert("Kopyalandı"); };
document.getElementById("playBtn").onclick=()=>{ alert("M3U kopyalandı - Mırtı TV v100 > AYAR > M3U içeriğini yapıştır'a yapıştır, Film ise otomatik Film (afiş) sekmesine düşer"); };
</script>
</body></html>
