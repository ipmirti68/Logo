

*2. MIRTITV V2 HTML - TAM KOD (kopyala):*
<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MırtıTv</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><style>:root{--g:#00FF88;--bg:#0F0F12;--c:#1A1A1E}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:sans-serif;display:flex;height:100vh}#s{width:320px;background:var(--c);display:flex;flex-direction:column;border-right:1px solid #222}#m{flex:1;display:flex;flex-direction:column}#p{width:100%;aspect-ratio:16/9;background:#000}.l{padding:14px;display:flex;flex-direction:column;gap:8px}.l input{padding:11px;background:#000;border:1px solid #333;color:#fff;border-radius:8px}.l button{padding:11px;background:var(--g);color:#000;font-weight:800;border:0;border-radius:8px}.cat{padding:11px 14px;cursor:pointer;border-left:3px solid transparent}.cat.a{background:#222;border-left-color:var(--g);color:var(--g)}.ch{padding:10px 14px;border-bottom:1px solid #1f1f23;cursor:pointer}.ch:hover{background:#222}#epg{padding:8px 12px;background:#15151a;font-size:12px;color:#aaa}@media(max-width:800px){body{flex-direction:column}#s{width:100%;height:50vh}#m{height:50vh}}</style></head><body>
<div id="s"><div class="l"><h3 style="color:var(--g);margin:0">MırtıTv v2</h3><input id="m3u" placeholder="M3U Linki"><div style="display:flex;gap:6px"><input id="srv" placeholder="Xtream Server" style="flex:1"></div><div style="display:flex;gap:6px"><input id="usr" placeholder="User" style="flex:1"><input id="pwd" placeholder="Pass" type="password" style="flex:1"></div><div style="display:flex;gap:6px"><button onclick="loadM3U()" style="flex:1">M3U</button><button onclick="loadXtream()" style="flex:1;background:#fff">Xtream</button></div><input id="epgIn" placeholder="EPG XML Link (opsiyonel)"><button onclick="loadEPG()" style="background:#222;color:#fff;border:1px solid #333">EPG Yükle</button></div><div id="cats" style="overflow:auto;flex:1"></div></div>
<div id="m"><video id="p" controls playsinline></video><div id="epg">Kanal seç, EPG burada</div><div id="chs" style="overflow:auto;flex:1"></div></div>
<script>let all=[],epg={},hls,cur='Tümü';const v=document.getElementById('p');function play(u,n){document.getElementById('epg').innerText=n+' - '+(epg[n]||'');if(Hls.isSupported()){if(hls)hls.destroy();hls=new Hls();hls.loadSource(u);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play());}else{v.src=u;v.play();}}function renderCats(){let cs=['Tümü',...new Set(all.map(c=>c.g))];document.getElementById('cats').innerHTML=cs.map(c=>`<div class="cat ${c===cur?'a':''}" onclick="filterCat('${c}')">${c} (${c==='Tümü'?all.length:all.filter(x=>x.g===c).length})</div>`).join('');}function filterCat(c){cur=c;renderCats();renderChs();}function renderChs(){let list=cur==='Tümü'?all:all.filter(x=>x.g===cur);document.getElementById('chs').innerHTML=list.map(x=>`<div class="ch" onclick="play('${x.u}','${x.n.replace(/'/g,'')}')">${x.n}</div>`).join('');}async function loadM3U(){let url=document.getElementById('m3u').value.trim();if(!url)return;if(url.endsWith('.m3u8')){all=[{n:'Manuel',u:url,g:'Genel'}];renderCats();renderChs();return;}let t=await fetch(url).then(r=>r.text());parseM3U(t);}function parseM3U(t){all=[];let nm='',gr='Genel';t.split('\n').forEach(l=>{l=l.trim();if(l.startsWith('#EXTINF')){let m=l.match(/,(.*)/);nm=m?m[1]:'Kanal';let g=l.match(/group-title="([^"]+)"/);gr=g?g[1]:'Genel';}else if(l&&!l.startsWith('#')){all.push({n:nm,u:l,g:gr});nm='';}});renderCats();renderChs();}async function loadXtream(){let s=document.getElementById('srv').value.trim().replace(/\/$/,''),u=document.getElementById('usr').value.trim(),p=document.getElementById('pwd').value.trim();if(!s||!u||!p){alert('Bilgileri gir');return;}let url=`${s}/player_api.php?username=${u}&password=${p}&action=get_live_streams`;try{let d=await fetch(url).then(r=>r.json());all=d.map(i=>({n:i.name,u:`${s}/live/${u}/${p}/${i.stream_id}.m3u8`,g:i.category_name||'Live'}));renderCats();renderChs();}catch(e){alert('CORS hatası, M3U kullan');}}async function loadEPG(){let url=document.getElementById('epgIn').value.trim();if(!url)return;let t=await fetch(url).then(r=>r.text());let x=new DOMParser().parseFromString(t,'text/xml');x.querySelectorAll('programme').forEach(p=>{let ch=p.getAttribute('channel');let ti=p.querySelector('title')?.textContent||'';if(!epg[ch])epg[ch]=ti;});alert('EPG ok: '+Object.keys(epg).length);}</script></body></html>
Bunu `Website 2 APK` uygulamasına yapıştırıp Build de, 30 saniyede `MırtıTv.apk` çıkacak.

Çıkınca bana yaz, Google TV kurulumunda takılırsan Send Files to TV adımını anlatayım.
